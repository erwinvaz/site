        }

        .btn {
            display: block;

            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            width: 100%;

            background: linear-gradient(135deg, #69F0AE 0%, #4CAF50 100%);
            color: #0F0F1E;
            box-shadow: 0 4px 15px rgba(105, 240, 174, 0.3);
        }

        .btn-primary:hover {

        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #69F0AE;
            color: #69F0AE;
        }

        .btn-secondary:hover {
            background: rgba(105, 240, 174, 0.1);
        }

        .instructions {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.8;
            text-align: left;
        }

        .instructions strong {
            color: #69F0AE;
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .instructions ol {
            margin-left: 20px;
        }

        }

            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

            color: #69F0AE;

            height: 16px;

        const SUPPORTED = Object.keys(I18N); // ['pt','en','es','fr','it','de','ja','ru','zh']
        const DEFAULT_LANG = 'en';

        // ============================================================
        // Detecção de idioma: ?lang= tem prioridade, depois navigator
        // ============================================================
        function detectLang() {
            const urlParams = new URLSearchParams(window.location.search);
            const forced = (urlParams.get('lang') || '').toLowerCase();
            if (SUPPORTED.includes(forced)) return forced;

            const navLangs = navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || navigator.userLanguage || DEFAULT_LANG];

            for (const raw of navLangs) {
                const code = raw.toLowerCase().split('-')[0];
                // zh-CN, zh-TW, zh-Hans etc → zh
                if (SUPPORTED.includes(code)) return code;
            }
            return DEFAULT_LANG;
        }

        const currentLang = detectLang();
        const t = I18N[currentLang];

        // ============================================================
        // Aplica traduções no DOM
        // ============================================================
        document.getElementById('htmlRoot').setAttribute('lang', currentLang);
        document.getElementById('pageTitleTag').textContent = t.pageTitle;
        document.getElementById('metaDescriptionTag').setAttribute('content', t.metaDescription);
        document.getElementById('ogTitleTag').setAttribute('content', t.ogTitle);
        document.getElementById('ogDescriptionTag').setAttribute('content', t.ogDescription);
        document.getElementById('heading').textContent = t.heading;
        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('codeLabel').textContent = t.codeLabel;
        document.getElementById('openApp').textContent = t.btnOpen;
        document.getElementById('copyCode').textContent = t.btnCopy;
        document.getElementById('instructionsTitle').textContent = t.instructionsTitle;

        const listEl = document.getElementById('instructionsList');
        t.instructions.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            listEl.appendChild(li);
        });

        // Seletor manual de idioma (mantém o código na URL)
        const langSwitchEl = document.getElementById('langSwitch');
        const urlParamsForSwitch = new URLSearchParams(window.location.search);
        SUPPORTED.forEach((code, idx) => {
            const a = document.createElement('a');
            const p = new URLSearchParams(urlParamsForSwitch);
            p.set('lang', code);
            a.href = '?' + p.toString();
            a.textContent = I18N[code].label;
            if (code === currentLang) a.classList.add('active');
            langSwitchEl.appendChild(a);
            if (idx < SUPPORTED.length - 1) {
                langSwitchEl.appendChild(document.createTextNode(' · '));
            }
        });

        // ============================================================
        // Lógica original: pega o código da URL e tenta abrir o app
        // ============================================================
        const code = urlParamsForSwitch.get('code');
        const statusDiv = document.getElementById('status');

        function showStatus(message, type = 'info') {
            statusDiv.innerHTML = message;
            statusDiv.className = `status-${type}`;
            statusDiv.style.display = 'block';
        }

        function hideStatus() {
            statusDiv.style.display = 'none';
        }

        if (code) {
            document.getElementById('matchCode').textContent = code;

            // Link para abrir o app — mesmo scheme customizado usado na versão em produção
            const deepLink = `chess://join?code=${code}`;
            document.getElementById('openApp').href = deepLink;

            document.getElementById('copyCode').addEventListener('click', (e) => {
                e.preventDefault();

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(code).then(() => {
                        showStatus(t.statusCopied, 'success');
                        setTimeout(hideStatus, 3000);
                    }).catch(() => {
                        fallbackCopyTextToClipboard(code);
                    });
                } else {
                    fallbackCopyTextToClipboard(code);
                }
            });

            function fallbackCopyTextToClipboard(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    document.execCommand('copy');
                    showStatus(t.statusCopiedFallback, 'success');
                    setTimeout(hideStatus, 3000);
                } catch (err) {
                    showStatus(t.statusCopyError + text, 'warning');
                }

                document.body.removeChild(textArea);
            }

            // Tenta abrir o app automaticamente após 1.5 segundos
            setTimeout(() => {
                showStatus('<span class="spinner"></span>' + t.statusOpening, 'info');
                window.location.href = deepLink;

                setTimeout(() => {
                    showStatus(t.statusNotInstalled, 'warning');
                }, 3000);
            }, 1500);

        } else {
            document.getElementById('matchCode').textContent = t.errorCode;
            document.querySelector('.code').style.borderColor = '#FF5252';
            document.querySelector('.code').style.color = '#FF5252';
            showStatus(t.errorMessage, 'warning');
            document.getElementById('openApp').style.display = 'none';
            document.getElementById('copyCode').style.display = 'none';
